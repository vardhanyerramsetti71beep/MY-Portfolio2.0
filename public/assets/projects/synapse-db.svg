<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
    <defs>
        <radialGradient id="gradBg" cx="50%" cy="50%" r="55%">
            <stop offset="0%" stop-color="#0f172a" />
            <stop offset="60%" stop-color="#080b12" />
            <stop offset="100%" stop-color="#030407" />
        </radialGradient>
        <radialGradient id="gradCore" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffb23f" stop-opacity="0.9"/>
            <stop offset="70%" stop-color="#ff5a1e" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#ffb23f" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="gradIso1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffb23f" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#ff5a1e" stop-opacity="0.1"/>
        </linearGradient>
        <linearGradient id="gradIso2" x1="1" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ff5a1e" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#ffb23f" stop-opacity="0.1"/>
        </linearGradient>
        <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="12" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.04"/>
        </pattern>
    </defs>
    <!-- Background -->
    <rect width="800" height="800" fill="url(#gradBg)" />
    <rect width="800" height="800" fill="url(#grid)" />
    
    <!-- Outer reticle -->
    <circle cx="400" cy="400" r="340" fill="none" stroke="#ffb23f" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="6,8"/>
    <circle cx="400" cy="400" r="370" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.07"/>
    
    <!-- Precision ticks -->
    <g stroke="#ffb23f" stroke-width="1.5" stroke-opacity="0.4">
        <line x1="400" y1="40" x2="400" y2="60" />
        <line x1="400" y1="740" x2="400" y2="760" />
        <line x1="40" y1="400" x2="60" y2="400" />
        <line x1="740" y1="400" x2="760" y2="400" />
    </g>

    <!-- Visual Element -->
    
        <g transform="translate(400, 340)">
            <!-- Isometric Hypercube -->
            <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45" fill="none" stroke="#ffb23f" stroke-width="2" stroke-opacity="0.8"/>
            <polygon points="0,-90 0,0 78,45 78,-45" fill="url(#gradIso1)" opacity="0.3"/>
            <polygon points="0,-90 0,0 -78,45 -78,-45" fill="url(#gradIso2)" opacity="0.5"/>
            <polygon points="0,0 78,45 0,90 -78,45" fill="url(#gradIso1)" opacity="0.2"/>
            <line x1="0" y1="0" x2="0" y2="90" stroke="#ffb23f" stroke-width="2"/>
            <line x1="0" y1="0" x2="78" y2="-45" stroke="#ffb23f" stroke-width="2"/>
            <line x1="0" y1="0" x2="-78" y2="-45" stroke="#ffb23f" stroke-width="2"/>
            <circle cx="0" cy="0" r="8" fill="#ffb23f"/>
            <circle cx="78" cy="45" r="5" fill="#ff5a1e"/>
            <circle cx="-78" cy="45" r="5" fill="#ff5a1e"/>
            <circle cx="0" cy="-90" r="5" fill="#ff5a1e"/>
            <circle cx="0" cy="90" r="5" fill="#ff5a1e"/>
            <!-- Vector orbital rings -->
            <ellipse cx="0" cy="0" rx="140" ry="60" fill="none" stroke="#ffb23f" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.6" transform="rotate(-20)"/>
            <ellipse cx="0" cy="0" rx="160" ry="70" fill="none" stroke="#ff5a1e" stroke-width="1.2" stroke-dasharray="3,6" opacity="0.4" transform="rotate(25)"/>
        </g>
        

    <!-- UI Specs / Labels -->
    <text x="400" y="580" text-anchor="middle" font-family="'Archivo', 'Helvetica', sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="#ffffff">SYNAPSE DB</text>
    <text x="400" y="615" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="14" letter-spacing="3" fill="#ffb23f">DISTRIBUTED VECTOR ENGINE</text>
    
    <!-- Tech badge box -->
    <g transform="translate(400, 660)">
        <rect x="-130" y="-15" width="260" height="30" rx="15" fill="#030407" stroke="#ffb23f" stroke-width="1" stroke-opacity="0.5"/>
        <circle cx="-110" cy="0" r="4" fill="#ffb23f"/>
        <text x="10" y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="1.5" fill="#e2e8f0">HNSW INDEX // SUB-2MS</text>
    </g>

    <!-- Corner telemetry -->
    <text x="70" y="90" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b" letter-spacing="1">SYS_SPEC // 0x7E1</text>
    <text x="730" y="90" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ffb23f" letter-spacing="1">ARCH: RELIANT</text>
    <text x="70" y="730" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b" letter-spacing="1">KERNEL: DISTRIBUTED</text>
    <text x="730" y="730" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b" letter-spacing="1">P99: PASS</text>
</svg>