<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
    <defs>
        <radialGradient id="gradBg" cx="50%" cy="50%" r="55%">
            <stop offset="0%" stop-color="#0f172a" />
            <stop offset="60%" stop-color="#080b12" />
            <stop offset="100%" stop-color="#030407" />
        </radialGradient>
        <radialGradient id="gradCore" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#10b981" stop-opacity="0.9"/>
            <stop offset="70%" stop-color="#00f2ff" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="gradIso1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#00f2ff" stop-opacity="0.1"/>
        </linearGradient>
        <linearGradient id="gradIso2" x1="1" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#00f2ff" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#10b981" stop-opacity="0.1"/>
        </linearGradient>
        <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="12" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.04"/>
        </pattern>
    </defs>
    <!-- Background -->
    <rect width="800" height="800" fill="url(#gradBg)" />
    <rect width="800" height="800" fill="url(#grid)" />
    
    <!-- Outer reticle -->
    <circle cx="400" cy="400" r="340" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="6,8"/>
    <circle cx="400" cy="400" r="370" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.07"/>
    
    <!-- Precision ticks -->
    <g stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4">
        <line x1="400" y1="40" x2="400" y2="60" />
        <line x1="400" y1="740" x2="400" y2="760" />
        <line x1="40" y1="400" x2="60" y2="400" />
        <line x1="740" y1="400" x2="760" y2="400" />
    </g>

    <!-- Visual Element -->
    
        <g transform="translate(400, 340)">
            <!-- Refracting triangular prism -->
            <polygon points="0,-110 95,55 -95,55" fill="none" stroke="#10b981" stroke-width="2" opacity="0.9"/>
            <polygon points="0,-110 95,55 -95,55" fill="url(#gradCore)" opacity="0.25"/>
            <!-- Refracted spectral beams -->
            <line x1="-170" y1="-20" x2="0" y2="0" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
            <line x1="0" y1="0" x2="160" y2="-40" stroke="#00f2ff" stroke-width="2.5" opacity="0.85"/>
            <line x1="0" y1="0" x2="170" y2="-10" stroke="#10b981" stroke-width="2.5" opacity="0.85"/>
            <line x1="0" y1="0" x2="165" y2="20" stroke="#f59e0b" stroke-width="2.5" opacity="0.85"/>
            <line x1="0" y1="0" x2="155" y2="50" stroke="#ec4899" stroke-width="2.5" opacity="0.85"/>
            <circle cx="0" cy="0" r="10" fill="#ffffff" filter="url(#glow)"/>
        </g>
        

    <!-- UI Specs / Labels -->
    <text x="400" y="580" text-anchor="middle" font-family="'Archivo', 'Helvetica', sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="#ffffff">PRISM AI</text>
    <text x="400" y="615" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="14" letter-spacing="3" fill="#10b981">MULTIMODAL INTELLIGENCE CANVAS</text>
    
    <!-- Tech badge box -->
    <g transform="translate(400, 660)">
        <rect x="-130" y="-15" width="260" height="30" rx="15" fill="#030407" stroke="#10b981" stroke-width="1" stroke-opacity="0.5"/>
        <circle cx="-110" cy="0" r="4" fill="#10b981"/>
        <text x="10" y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="1.5" fill="#e2e8f0">CRDT ENGINE // REALTIME</text>
    </g>

    <!-- Corner telemetry -->
    <text x="70" y="90" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b" letter-spacing="1">SYS_SPEC // 0x7E1</text>
    <text x="730" y="90" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10b981" letter-spacing="1">ARCH: RELIANT</text>
    <text x="70" y="730" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b" letter-spacing="1">KERNEL: DISTRIBUTED</text>
    <text x="730" y="730" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b" letter-spacing="1">P99: PASS</text>
</svg>